name: Publish Builder Image to GHCR

on:
  push:
    paths:
      - '.github/docker/**'
      - '.github/workflows/docker_builder.yml'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-docker:
    name: Build & Push Docker Builder Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner & Name
        id: repo
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/android-builder" >> $GITHUB_OUTPUT

      - name: Check if Image Tag Already Exists on GHCR
        id: check_image
        continue-on-error: true
        run: |
          if docker manifest inspect ${{ steps.repo.outputs.IMAGE_NAME }}:${{ github.sha }} > /dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Docker image tag ${{ github.sha }} already exists on GHCR. Skipping build."
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_image.outputs.EXISTS != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        if: steps.check_image.outputs.EXISTS != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.IMAGE_NAME }}:latest
            ${{ steps.repo.outputs.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
