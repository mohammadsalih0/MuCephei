name: Build and Publish Android Release Package

on:
  push:
    tags:
      - 'v*'
      - '*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle Wrapper Distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-${{ runner.os }}-

      - name: Cache Android SDK CMake
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/cmake
          key: android-sdk-cmake-${{ runner.os }}-3.22.1
          restore-keys: |
            android-sdk-cmake-${{ runner.os }}-

      - name: Setup CCache for Native C++ Compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Decode Keystore
        if: env.SIGNING_KEY != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > release.keystore

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract Tag & Version
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="v2.0-${GITHUB_SHA::7}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Prepare APK Output
        run: |
          mkdir -p package_dist
          cp app/build/outputs/apk/release/*.apk package_dist/MuCephei-${{ steps.vars.outputs.TAG_NAME }}.apk 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mucephei-release-apk-${{ steps.vars.outputs.TAG_NAME }}
          path: package_dist/

      - name: Extract Changelog from version.json
        id: changelog
        run: |
          CHANGELOG=$(jq -r '.changelog' version.json)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release Package
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            package_dist/*.apk
          body: ${{ steps.changelog.outputs.content }}
          name: "Release ${{ steps.vars.outputs.TAG_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
